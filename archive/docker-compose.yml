services:
  # Next.js frontend + API
  web:
    build: ./client_server
    container_name: nextjs_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mongodb://db:27017/pbl4_db
    depends_on:
      - db

  scraper:
    build: ./scraper
    container_name: python_worker
    ports:
      - "37002:37002"
    environment:
      - DATABASE_URL=mongodb://db:27017/pbl4_db
    depends_on:
      - db

  # MongoDB database
  db:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

